<!DOCTYPE html>
<html>
<head>
  <title>Sorter Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      text-align: center;
      background: white;
    }

    #homeScreen {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: white;
    }

    .bg-shapes {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .shape {
      position: absolute;
      opacity: 0.15;
    }

    .circle {
      width: 100px;
      height: 100px;
      background: red;
      border-radius: 50%;
      top: 20px;
      left: 20px;
    }

    .square {
      width: 90px;
      height: 90px;
      background: blue;
      top: 60%;
      left: 10%;
    }

    .triangle {
      width: 0;
      height: 0;
      border-left: 50px solid transparent;
      border-right: 50px solid transparent;
      border-bottom: 90px solid green;
      top: 30%;
      right: 20px;
    }

    .diamond {
      width: 70px;
      height: 70px;
      background: orange;
      transform: rotate(45deg);
      bottom: 20px;
      right: 30px;
    }

    #homeScreen h1,
    #homeScreen p,
    #homeScreen button {
      position: relative;
      z-index: 1;
    }

    #homeScreen button {
      margin-top: 20px;
      padding: 10px 25px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      background: orange;
      color: white;
      cursor: pointer;
    }

    #game {
      display: none;
      padding: 20px;
    }

    canvas {
      background: white;
      border: 2px solid black;
      margin-top: 20px;
    }

    button {
      font-size: 14px;
      padding: 8px 15px;
      margin: 6px;
      border-radius: 6px;
      border: none;
      color: white;
      cursor: pointer;
    }

    .leftBtn { background: red; }
    .rightBtn { background: blue; }
    .restartBtn { background: gray; }

    #result {
      margin-top: 10px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="homeScreen">
  <div class="bg-shapes">
    <div class="shape circle"></div>
    <div class="shape square"></div>
    <div class="shape triangle"></div>
    <div class="shape diamond"></div>
  </div>

  <h1>Sorter Game</h1>
  <p>Match colors or shapes  press correct side</p>

  <button onclick="startGame()">PLAY</button>
</div>

<div id="game">
  <h3 id="info"></h3>
  <div id="rule"></div>

  <canvas id="gameCanvas" width="220" height="220"></canvas>

  <div>
    <button class="leftBtn" onclick="handleInput('L')">LEFT</button>
    <button class="rightBtn" onclick="handleInput('R')">RIGHT</button>
    <button class="restartBtn" onclick="restartGame()">RESTART</button>
  </div>

  <div id="result"></div>
</div>

<script>

const SoundEngine = {
  ctx: null,

  init() {
    if (this.ctx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    this.ctx = new AudioCtx();
  },

  play(freq, time){
    if(!this.ctx) return;

    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();

    o.type = "sine";
    o.frequency.value = freq;

    g.gain.setValueAtTime(0.2, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + time);

    o.connect(g);
    g.connect(this.ctx.destination);

    o.start();
    o.stop(this.ctx.currentTime + time);
  },

  win(){
    this.init();
    this.play(600,0.1);
    setTimeout(()=>this.play(800,0.1),120);
  },

  lose(){
    this.init();
    this.play(300,0.2);
  },

  level(){
    this.init();
    this.play(500,0.1);
  }
}
const shapes=["circle","square","triangle"];
const colors=["red","blue","green"];

let score=0, level=1, wrong=0, gameOver=false;
let ruleType, ruleValue, ruleSide;
let currentObj;
let speed=800;

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

function startGame(){
  SoundEngine.init(); 
  document.getElementById("homeScreen").style.display="none";
  document.getElementById("game").style.display="block";
  nextRound();
}

function drawShape(o){
  ctx.clearRect(0,0,220,220);
  ctx.fillStyle=o.color;

  if(o.shape==="circle"){
    ctx.beginPath();
    ctx.arc(110,110,60,0,Math.PI*2);
    ctx.fill();
  }

  if(o.shape==="square"){
    ctx.fillRect(60,60,100,100);
  }

  if(o.shape==="triangle"){
    ctx.beginPath();
    ctx.moveTo(110,50);
    ctx.lineTo(50,170);
    ctx.lineTo(170,170);
    ctx.fill();
  }
}

function changeRule(){
  if(level==1){
    ruleType="color";
  }
  else if(level==2){
    ruleType=Math.random()<0.5?
    "color":"shape";
  }
  else{
  ruleType = Math.random()<0.5 ? "color" : "shape";
  }
  ruleValue = ruleType==="shape"
    ? shapes[Math.floor(Math.random()*3)]
    : colors[Math.floor(Math.random()*3)];

  ruleSide = Math.random()<0.5 ? "LEFT" : "RIGHT";
}

function nextRound(){
  changeRule();

  currentObj={
    shape:shapes[Math.floor(Math.random()*3)],
    color:colors[Math.floor(Math.random()*3)]
  };

  drawShape(currentObj);
   let sentence;

  if (ruleType === "shape") {
    sentence = "If the shape is a " + ruleValue + ", press " + ruleSide + ".";
  } else {
    sentence = "If the color is " + ruleValue + ", press " + ruleSide + ".";
  }

  document.getElementById("rule").innerText = sentence;

  document.getElementById("info").innerText =
    "Level: " + level + " | Score: " + score;
}

function handleInput(choice){

  if(gameOver) return;

  SoundEngine.init();

  let match = (ruleType==="shape")
    ? currentObj.shape===ruleValue
    : currentObj.color===ruleValue;

  let correct = (ruleSide==="LEFT")
    ? (match && choice==="L") || (!match && choice==="R")
    : (match && choice==="R") || (!match && choice==="L");

  if(correct){
    score++;
    document.getElementById("result").innerText="Correct 😊";
    SoundEngine.win();
  } else {
    wrong++;
    document.getElementById("result").innerText="Try again 🙂";
    SoundEngine.lose();
  }

  if(score%5===0 && score!==0){
    level++;
    SoundEngine.level();
    if(speed>300) speed-=120;
  }

  if(wrong>=5){
    gameOver=true;
    document.getElementById("result").innerText="Game Over  Press Restart";
    SoundEngine.lose();
    return;
  }

  setTimeout(nextRound, speed);
}
function restartGame(){
  score=0;
  level=1;
  wrong=0;
  gameOver=false;
  speed=800;

  document.getElementById("result").innerText="";
  nextRound();
}

</script>

</body>
</html>
