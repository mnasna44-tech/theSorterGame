<!DOCTYPE html>
<html>
<head>
  <title>Sorter Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #gameContainer {
      width: 260px;
      text-align: center;
    }

    canvas {
      background: white;
      border: 2px solid black;
      margin-top: 10px;
    }

    #info {
      font-size: 14px;
    }

    #rule {
      font-size: 16px;
      margin-top: 10px;
    }

    #result {
      margin-top: 10px;
      font-size: 18px;
      height: 24px;
    }

    button {
      font-size: 14px;
      padding: 6px 12px;
      margin: 5px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      color: white;
    }

    .leftBtn { background: #e03131; }   
    .rightBtn { background: #1c7ed6; }  
    .restartBtn { background: grey; }
  </style>
</head>

<body>

<div id="gameContainer">

  <div id="info">Level: 1 | Score: 0</div>
  <div id="rule"></div>

  <canvas id="gameCanvas" width="220" height="220"></canvas>

  <div>
    <button class="leftBtn" onclick="handleInput('L')">LEFT</button>
    <button class="rightBtn" onclick="handleInput('R')">RIGHT</button>
    <button class="restartBtn" onclick="restartGame()">RESTART</button>
  </div>

  <div id="result"></div>

</div>

<script>

const Sound = {
  ctx: null,

  init() {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;

    if (!this.ctx) this.ctx = new AudioCtx();

    if (this.ctx.state === "suspended") {
      this.ctx.resume();
    }
  },

  play(freq, time, type="sine", vol=0.2) {
    if (!this.ctx) return;

    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();

    o.type = type;
    o.frequency.value = freq;

    g.gain.setValueAtTime(vol, this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + time);

    o.connect(g);
    g.connect(this.ctx.destination);

    o.start();
    o.stop(this.ctx.currentTime + time);
  },
  win() {
    this.init();
    this.play(500, 0.1);
    setTimeout(() => this.play(700, 0.1), 100);
    setTimeout(() => this.play(900, 0.15), 200);
  },

  wrong() {
    this.init();
    this.play(300, 0.2, "sine", 0.15);
  },

  start() {
    this.init();
    this.play(400, 0.1);
  }
};

const shapes = ["circle", "square", "triangle"];

const colors = [
  { name: "red", value: "#e03131" },
  { name: "blue", value: "#1c7ed6" },
  { name: "green", value: "#2f9e44" }
];

let score = 0, level = 1, wrong = 0, gameOver = false;
let ruleType, ruleValue, ruleSide;
let currentObj;

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function drawShape(o){
  ctx.clearRect(0,0,220,220);
  ctx.fillStyle = o.color.value;

  if(o.shape === "circle"){
    ctx.beginPath();
    ctx.arc(110,110,60,0,Math.PI*2);
    ctx.fill();
  }

  if(o.shape === "square"){
    ctx.fillRect(60,60,100,100);
  }

  if(o.shape === "triangle"){
    ctx.beginPath();
    ctx.moveTo(110,50);
    ctx.lineTo(50,170);
    ctx.lineTo(170,170);
    ctx.fill();
  }
}

function changeRule(){
  ruleType = level === 1 ? "color" : (Math.random()<0.5?"shape":"color");

  if(ruleType === "color"){
    ruleValue = colors[Math.floor(Math.random()*colors.length)];
  } else {
    ruleValue = shapes[Math.floor(Math.random()*shapes.length)];
  }

  ruleSide = Math.random()<0.5 ? "LEFT" : "RIGHT";
}

function nextRound(){
  changeRule();

  currentObj = {
    shape: shapes[Math.floor(Math.random()*3)],
    color: colors[Math.floor(Math.random()*3)]
  };

  drawShape(currentObj);

  let text = "";

  if(ruleType === "color"){
    text = "If color is " + ruleValue.name + ", press " + ruleSide;
  } else {
    text = "If shape is " + ruleValue + ", press " + ruleSide;
  }

  document.getElementById("rule").innerText = text;

  document.getElementById("info").innerText =
    "Level: " + level + " | Score: " + score;
}

function handleInput(choice){
  if(gameOver) return;

  Sound.init(); 

  let match = (ruleType === "color")
    ? currentObj.color.name === ruleValue.name
    : currentObj.shape === ruleValue;

  let correct;

  if(ruleSide === "LEFT"){
    correct = match ? (choice === "L") : (choice === "R");
  } else {
    correct = match ? (choice === "R") : (choice === "L");
  }

  if(correct){
    score++;
    document.getElementById("result").innerText = "Correct 😊";
    Sound.win();
  } else {
    wrong++;
    document.getElementById("result").innerText = "Try again 🙂";
    Sound.wrong();
  }

  if(score % 5 === 0 && score !== 0){
    level++;
  }

  if(wrong >= 5){
    document.getElementById("result").innerText = "Game Over";
    Sound.wrong();
    gameOver = true;
    return;
  }

  setTimeout(()=>{
    document.getElementById("result").innerText = "";
    nextRound();
  },700);
}

function restartGame(){
  score = 0;
  level = 1;
  wrong = 0;
  gameOver = false;
  document.getElementById("result").innerText = "";
  nextRound();
}

document.body.addEventListener("click", () => {
  Sound.start();
}, { once: true });

nextRound();

</script>

</body>
</html>
